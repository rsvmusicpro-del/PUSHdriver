name: Build PUSHdriver

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PUSHdriver and external sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assemble Push 1-only source tree
        run: python3 scripts/prepare_push1.py

      - name: Snapshot assembled sources
        run: |
          set -euo pipefail
          find src/main/java src/main/resources src/assembly maven-local-repository -type f -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/pushdriver-assembly-before.sha256
          sha256sum pom.xml >> /tmp/pushdriver-assembly-before.sha256

      - name: Verify source assembly is reproducible
        run: |
          set -euo pipefail
          python3 scripts/prepare_push1.py
          find src/main/java src/main/resources src/assembly maven-local-repository -type f -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/pushdriver-assembly-after.sha256
          sha256sum pom.xml >> /tmp/pushdriver-assembly-after.sha256
          diff -u /tmp/pushdriver-assembly-before.sha256 /tmp/pushdriver-assembly-after.sha256

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test Push 1 LCD protocol engine
        run: python3 scripts/test_push1_display.py

      - name: Test Push 1 note repeat and sequencer safety
        run: python3 scripts/test_push1_modes.py

      - name: Test Push 1 empty-clip playhead guard
        run: python3 scripts/test_push1_playhead.py

      - name: Test Push 1 directional navigation
        run: python3 scripts/test_push1_navigation.py

      - name: Test Push 1 firmware inquiry parsing
        run: python3 scripts/test_push1_firmware.py

      - name: Build extension
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify Push 1-only package
        run: python3 scripts/verify_push1.py

      - name: Smoke-test Bitwig extension discovery
        run: python3 scripts/test_push1_extension.py

      - name: Prepare Bitwig extension
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/PUSHdriver-19.2.2.jar dist/PUSHdriver.bwextension
          test -s dist/PUSHdriver.bwextension

      - name: Upload PUSHdriver.bwextension
        uses: actions/upload-artifact@v4
        with:
          name: PUSHdriver-bwextension
          path: dist/PUSHdriver.bwextension
          if-no-files-found: error
          retention-days: 30
