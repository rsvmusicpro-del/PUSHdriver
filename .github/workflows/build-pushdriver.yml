name: Build PUSHdriver

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PUSHdriver
        uses: actions/checkout@v4

      - name: Checkout DrivenByMoss 19.0.0
        uses: actions/checkout@v4
        with:
          repository: git-moss/DrivenByMoss
          ref: 19.0.0
          path: upstream

      - name: Assemble Push 1-only source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/java/de/mossgrabers src/main/resources/META-INF/services
          cp -a upstream/src/main/java/de/mossgrabers/framework src/main/java/de/mossgrabers/
          cp -a upstream/src/main/java/de/mossgrabers/bitwig/framework src/main/java/de/mossgrabers/bitwig/
          mkdir -p src/main/java/de/mossgrabers/bitwig/controller/ableton
          cp -a upstream/src/main/java/de/mossgrabers/bitwig/controller/ableton/push src/main/java/de/mossgrabers/bitwig/controller/ableton/
          mkdir -p src/main/java/de/mossgrabers/controller/ableton
          cp -a upstream/src/main/java/de/mossgrabers/controller/ableton/push src/main/java/de/mossgrabers/controller/ableton/
          rm -f src/main/java/de/mossgrabers/bitwig/controller/ableton/push/Push2ControllerExtensionDefinition.java
          rm -f src/main/java/de/mossgrabers/controller/ableton/push/controller/Push2Display.java

          # The upstream shared drum view accidentally imports Maschine's color manager.
          # Resolve these two colors through the active controller's color manager instead.
          python3 - <<'PY'
          from pathlib import Path

          drum_view = Path("src/main/java/de/mossgrabers/framework/view/sequencer/AbstractDrumView.java")
          text = drum_view.read_text()
          old_import = "import de.mossgrabers.controller.ni.maschine.core.MaschineColorManager;\n"
          if old_import not in text:
              raise SystemExit("Expected MaschineColorManager import was not found")
          text = text.replace(old_import, "", 1)
          replacements = {
              "MaschineColorManager.COLOR_GREEN": "this.colorManager.getColorIndex (DAWColor.DAW_COLOR_GREEN)",
              "MaschineColorManager.COLOR_LIME_LO": "this.colorManager.getColorIndex (DAWColor.DAW_COLOR_MOSS_GREEN)",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old}")
              text = text.replace(old, new, 1)
          drum_view.write_text(text)

          setup = Path("src/main/java/de/mossgrabers/controller/ableton/push/PushControllerSetup.java")
          text = setup.read_text()
          old_import = "import de.mossgrabers.controller.ableton.push.controller.Push2Display;\n"
          if old_import not in text:
              raise SystemExit("Expected Push2Display import was not found")
          text = text.replace(old_import, "", 1)
          old_display = """        if (this.isPush2)
            surface.addGraphicsDisplay (new Push2Display (this.host, this.valueChanger.getUpperBound (), this.configuration));
        else
            surface.addTextDisplay (new Push1Display (this.host, this.valueChanger.getUpperBound (), output, this.configuration));"""
          new_display = """        surface.addTextDisplay (new Push1Display (this.host, this.valueChanger.getUpperBound (), output, this.configuration));"""
          if text.count(old_display) != 1:
              raise SystemExit("Expected Push 1/Push 2 display selection was not found exactly once")
          text = text.replace(old_display, new_display, 1)
          setup.write_text(text)
          PY

          printf '%s\n' 'de.mossgrabers.bitwig.controller.ableton.push.Push1ControllerExtensionDefinition' > src/main/resources/META-INF/services/com.bitwig.extension.ExtensionDefinition
          mkdir -p src/assembly
          cp upstream/src/assembly/dep.xml src/assembly/dep.xml
          cp -a upstream/maven-local-repository ./maven-local-repository
          cp upstream/pom.xml ./pom.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pom.xml")
          s = p.read_text()
          s = s.replace("<artifactId>DrivenByMoss</artifactId>", "<artifactId>PUSHdriver</artifactId>", 1)
          s = s.replace("<name>DrivenByMoss</name>", "<name>PUSHdriver</name>", 1)
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build extension
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify Push 1-only package
        shell: bash
        run: |
          set -euo pipefail
          jar tf target/PUSHdriver-19.0.0.jar > target/package-contents.txt
          test "$(grep -c '^de/mossgrabers/bitwig/controller/' target/package-contents.txt)" -eq "$(grep -c '^de/mossgrabers/bitwig/controller/ableton/push/Push1ControllerExtensionDefinition.class$' target/package-contents.txt)"
          if grep -Eiq '^de/mossgrabers/controller/(ni|akai|novation|faderfox|livid|nativeinstruments)/' target/package-contents.txt; then
            echo "Foreign controller implementation found in package" >&2
            grep -Ei '^de/mossgrabers/controller/(ni|akai|novation|faderfox|livid|nativeinstruments)/' target/package-contents.txt >&2
            exit 1
          fi
          if grep -Eiq 'Push2(Display|Controller)|MaschineColorManager' target/package-contents.txt; then
            echo "Push 2 or Maschine implementation found in package" >&2
            grep -Ei 'Push2(Display|Controller)|MaschineColorManager' target/package-contents.txt >&2
            exit 1
          fi
          service="$(unzip -p target/PUSHdriver-19.0.0.jar META-INF/services/com.bitwig.extension.controller.api.ControllerExtensionDefinition 2>/dev/null || true)"
          if [ -z "$service" ]; then
            service="$(unzip -p target/PUSHdriver-19.0.0.jar META-INF/services/com.bitwig.extension.ExtensionDefinition)"
          fi
          test "$service" = "de.mossgrabers.bitwig.controller.ableton.push.Push1ControllerExtensionDefinition"

      - name: Prepare Bitwig extension
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/PUSHdriver-19.0.0.jar dist/PUSHdriver.bwextension
          test -s dist/PUSHdriver.bwextension

      - name: Upload PUSHdriver.bwextension
        uses: actions/upload-artifact@v4
        with:
          name: PUSHdriver-bwextension
          path: dist/PUSHdriver.bwextension
          if-no-files-found: error
          retention-days: 30
