name: Build PUSHdriver

on:
  push:
    branches: [custom]
  pull_request:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PUSHdriver and external sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enforce Push 1 static-row LED safety
        run: python3 scripts/check_push1_led_safety.py

      - name: Assemble Push 1-only source tree
        run: python3 scripts/prepare_push1.py

      - name: Snapshot assembled sources
        run: |
          set -euo pipefail
          find src/main/java src/main/resources src/assembly maven-local-repository -type f -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/pushdriver-assembly-before.sha256
          sha256sum pom.xml >> /tmp/pushdriver-assembly-before.sha256

      - name: Verify source assembly is reproducible
        run: |
          set -euo pipefail
          python3 scripts/prepare_push1.py
          find src/main/java src/main/resources src/assembly maven-local-repository -type f -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/pushdriver-assembly-after.sha256
          sha256sum pom.xml >> /tmp/pushdriver-assembly-after.sha256
          diff -u /tmp/pushdriver-assembly-before.sha256 /tmp/pushdriver-assembly-after.sha256

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build extension
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify Push 1-only package
        run: python3 scripts/verify_push1.py

      - name: Run unified virtual Push 1 simulation suite
        run: python3 scripts/test_push1_extension.py

      - name: Validate one-command local bench runner
        run: python3 -m py_compile scripts/run_virtual_push1.py

      - name: Prepare Bitwig extension
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/PUSHdriver-19.2.2.jar dist/PUSHdriver.bwextension
          test -s dist/PUSHdriver.bwextension

      - name: Upload PUSHdriver.bwextension
        uses: actions/upload-artifact@v4
        with:
          name: PUSHdriver-bwextension
          path: dist/PUSHdriver.bwextension
          if-no-files-found: error
          retention-days: 30

  # The primary artifact is built on Linux, but the same source and runtime
  # checks must also pass on an Intel macOS host. This exercises the macOS
  # discovery branch and Java packaging on the architecture used by Catalina.
  macos-intel-validation:
    runs-on: macos-15-intel
    steps:
      - name: Checkout PUSHdriver and external sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enforce Push 1 static-row LED safety
        run: python3 scripts/check_push1_led_safety.py

      - name: Assemble Push 1-only source tree
        run: python3 scripts/prepare_push1.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build extension on Intel macOS
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify Push 1-only package
        run: python3 scripts/verify_push1.py

      - name: Run unified virtual Push 1 simulation suite on macOS
        run: python3 scripts/test_push1_extension.py

  quality-gate:
    if: always()
    needs: [build, macos-intel-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform validation to pass
        env:
          LINUX_RESULT: ${{ needs.build.result }}
          MACOS_RESULT: ${{ needs.macos-intel-validation.result }}
        run: |
          set -euo pipefail
          echo "Linux: ${LINUX_RESULT}"
          echo "macOS Intel: ${MACOS_RESULT}"
          test "${LINUX_RESULT}" = success
          test "${MACOS_RESULT}" = success
