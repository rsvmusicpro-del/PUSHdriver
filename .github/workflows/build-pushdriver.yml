name: Build PUSHdriver

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PUSHdriver
        uses: actions/checkout@v4


      - name: Assemble Push 1-only source tree
        run: python3 scripts/prepare_push1.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build extension
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify Push 1-only package
        run: python3 scripts/verify_push1.py

      - name: Prepare Bitwig extension
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/PUSHdriver-19.0.0.jar dist/PUSHdriver.bwextension
          test -s dist/PUSHdriver.bwextension

      - name: Upload PUSHdriver.bwextension
        uses: actions/upload-artifact@v4
        with:
          name: PUSHdriver-bwextension
          path: dist/PUSHdriver.bwextension
          if-no-files-found: error
          retention-days: 30
